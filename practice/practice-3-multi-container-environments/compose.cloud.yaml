name: ct-2026-practice-3
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - notes:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  web:
    image: ct-2026-practice-3-notes:2026-10-18-amd64
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "0.0.0.0:8083:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  notes:
    external: true
    name: ct-2026-practice-3-notes
