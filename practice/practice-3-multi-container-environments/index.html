<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Заметки</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 20px;background:#f3f5f9;color:#172035;font:17px/1.6 system-ui,sans-serif}main{max-width:680px;margin:40px auto;padding:32px;background:white;border:1px solid #dde3ed;border-radius:20px}h1{margin:0}p{color:#58657b}label{display:block;font-weight:600}textarea,button{font:inherit;border:1px solid #b6c2d4;border-radius:10px;padding:12px;width:100%}textarea{resize:vertical;min-height:110px}button{margin-top:12px;background:#2759bc;color:white;cursor:pointer}button:disabled{opacity:.6}li{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 0}output{display:block;margin-top:16px}output[data-error="true"]{color:#a51c30}:focus-visible{outline:3px solid #83a9f4;outline-offset:3px}
</style>
<main>
<h1>Заметки</h1>
<p>Небольшие записи, которые сохраняются между запусками приложения.</p>
<form id="notes-form">
<label for="text">Новая заметка</label>
<textarea id="text" maxlength="500" required placeholder="Что нужно запомнить?"></textarea>
<button>Добавить заметку</button>
</form>
<output id="status" aria-live="polite"></output>
<h2>Сохранённые заметки</h2>
<p id="empty" hidden>Пока нет заметок.</p><ol id="notes"></ol>
</main>
<script>
const form=document.getElementById('notes-form');
const field=document.getElementById('text');
const status=document.getElementById('status');
const button=form.querySelector('button');
async function api(path,options){
 const response=await fetch(path,options);
 const data=await response.json();
 if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Введите от 1 до 500 символов.');
 return data;
}
async function load(){
 const data=await api('/api/notes');
 const list=document.getElementById('notes');list.replaceChildren();
 for(const text of data.notes){const li=document.createElement('li');li.textContent=text;list.append(li);}
 document.getElementById('empty').hidden=data.notes.length!==0;
}
function failure(error){status.dataset.error='true';status.textContent=error instanceof TypeError?'Не удалось связаться с сервером.':error.message;}
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.dataset.error='false';status.textContent='Сохраняем…';
 try{await api('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:field.value})});field.value='';await load();status.textContent='Заметка сохранена.';}catch(error){failure(error);}finally{button.disabled=false;}
});
load().catch(failure);
</script>
</html>
