version: "3.8"
services:
  registry:
    image: registry:2
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/secrets/ct-registry-cert
      REGISTRY_HTTP_TLS_KEY: /run/secrets/ct-registry-key
    secrets: [ct-registry-cert, ct-registry-key]
    volumes: [registry-data:/var/lib/registry]
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
volumes:
  registry-data:
secrets:
  ct-registry-cert:
    external: true
  ct-registry-key:
    external: true
