name: ct-practice4
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [csv-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  api:
    image: susu-cloud-practice4:2026-10-17
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8005:8000"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: susu-cloud-practice4:2026-10-17
    command: [python, worker.py]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  csv-data:
